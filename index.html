<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<!-- ホーム画面に追加したとき全画面アプリとして開くための設定 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="IDカード">
<meta name="theme-color" content="#102145">

<title>IDカード</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }

  :root {
    --navy: #102145;          /* ヘッダーの紺 */
    --navy-2: #1b3063;
    --chrome-fg: #ffffff;
    --chrome-sub: #9aa6c2;
    --page: #ffffff;          /* 白地 */
    --fg: #14171c;
    --label: #8a8f99;
    --val: #15181d;
    --seal: #c0392b;
    --line: #ececf0;
    --accent: #2f6df0;
  }

  body {
    font-family: "Noto Sans JP", system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    background: var(--navy);
    color: var(--fg);
    min-height: 100dvh;
    -webkit-tap-highlight-color: transparent;
    display: flex; justify-content: center;
  }

  .app {
    width: 100%; max-width: 480px;
    height: 100dvh;
    overflow: hidden;
    background: var(--navy);
    display: flex; flex-direction: column;
    position: relative;
  }

  /* 紺ヘッダー（ステータスバーの下まで回り込む） */
  .header {
    background: var(--navy);
    color: var(--chrome-fg);
    padding-top: calc(env(safe-area-inset-top, 0px) + 14px);
    padding-bottom: 30px;
    padding-left: max(18px, env(safe-area-inset-left, 0px));
    padding-right: max(18px, env(safe-area-inset-right, 0px));
  }
  .header-row { display: flex; align-items: center; gap: 12px; }
  .header .ico { width: 42px; height: 33px; flex: none; opacity: .9; }
  .header .titles { flex: 1; text-align: center; }
  .header .titles h1 { margin: 0; font-size: 20px; font-weight: 700; letter-spacing: .3em; padding-left: .3em; }
  .header .titles time { display: block; margin-top: 5px; font-size: 12px; color: var(--chrome-sub); font-variant-numeric: tabular-nums; }
  .close {
    width: 33px; height: 33px; flex: none; border-radius: 50%;
    background: rgba(255,255,255,.14); border: none; color: var(--chrome-fg);
    font-size: 17px; line-height: 1; cursor: pointer; display: grid; place-items: center;
  }

  /* 白地のコンテンツ（肩を丸くしてヘッダーに重ねる） */
  .content {
    flex: 1;
    background: var(--page);
    border-radius: 22px;
    margin: 6px max(14px, env(safe-area-inset-right, 0px)) 16px max(14px, env(safe-area-inset-left, 0px));
    box-shadow: 0 10px 30px rgba(0,0,0,.28);
    padding: 28px 22px calc(34px + env(safe-area-inset-bottom, 0px));
  }

  .photo {
    width: 196px; max-width: 60%; aspect-ratio: 3 / 4;
    margin: 4px auto 26px; border-radius: 5px;
    background: linear-gradient(180deg, #dadee5, #c4cad4);
    display: grid; place-items: center; overflow: hidden;
  }
  .photo svg { width: 68%; height: 68%; opacity: .55; }
  .photo img { width: 100%; height: 100%; object-fit: cover; }

  .name-block { text-align: center; margin-bottom: 30px; }
  .name-block .lab { font-size: 13px; color: var(--label); letter-spacing: .12em; }
  .name-block .val { font-size: 20px; font-weight: 700; letter-spacing: .18em; margin-top: 8px; color: var(--val); }

  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 26px 16px; text-align: center; margin-bottom: 30px; }
  .grid .lab { font-size: 13px; color: var(--label); letter-spacing: .08em; }
  .grid .val { font-size: 15px; font-weight: 700; margin-top: 8px; color: var(--val); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }

  .footer { padding-top: 6px; display: flex; align-items: flex-end; gap: 14px; }
  .footer .text { flex: 1; min-width: 0; font-size: 11.5px; line-height: 1.75; }
  .footer .text .cert { margin: 0 0 12px; }
  .footer .text .addr { margin: 0; color: #2b2f36; }
  .footer .text .issuer { margin: 6px 0 0; font-size: 15px; font-weight: 700; }

  /* 印（本物の公印ではなく「見本」ダミー） */
  .seal {
    flex: none; width: 90px; height: 90px;
    border: 3px solid var(--seal); border-radius: 8px; color: var(--seal);
    display: grid; place-items: center; transform: rotate(-4deg); font-weight: 700;
  }
  .seal span { writing-mode: vertical-rl; font-size: 27px; letter-spacing: .2em; }

  /* 編集ボタン */
  .edit-fab {
    position: fixed; z-index: 20;
    right: calc(18px + env(safe-area-inset-right, 0px));
    bottom: calc(20px + env(safe-area-inset-bottom, 0px));
    height: 50px; padding: 0 22px; border: none; border-radius: 25px;
    background: var(--accent); color: #fff; font-size: 15px; font-weight: 700;
    font-family: inherit; cursor: pointer; box-shadow: 0 8px 22px rgba(0,0,0,.35);
    display: inline-flex; align-items: center; gap: 8px;
  }

  /* 編集シート */
  .sheet-bg { position: fixed; inset: 0; z-index: 30; background: rgba(0,0,0,.5); display: none; }
  .sheet-bg.open { display: block; }
  .sheet {
    position: fixed; z-index: 31; left: 0; right: 0; bottom: 0;
    margin: 0 auto; max-width: 480px; max-height: 88dvh; overflow-y: auto;
    background: var(--page); color: var(--fg);
    border-radius: 18px 18px 0 0;
    padding: 20px max(18px, env(safe-area-inset-left, 0px)) calc(24px + env(safe-area-inset-bottom, 0px));
    transform: translateY(100%); transition: transform .25s ease;
  }
  .sheet.open { transform: translateY(0); }
  .sheet h2 { margin: 4px 0 16px; font-size: 18px; text-align: center; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12px; color: var(--label); margin-bottom: 5px; }
  .field input {
    width: 100%; padding: 10px 12px; font-size: 16px; font-family: inherit;
    border: 1px solid var(--line); border-radius: 10px; background: #f7f8fa; color: var(--fg);
  }
  .photo-row { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; }
  .photo-prev { width: 54px; height: 72px; border-radius: 4px; background: #d9dde4; object-fit: cover; flex: none; }
  .btn-row { display: flex; gap: 10px; margin-top: 10px; }
  .btn { flex: 1; padding: 13px; border-radius: 12px; border: none; font-size: 15px; font-weight: 700; font-family: inherit; cursor: pointer; }
  .btn.save { background: var(--accent); color: #fff; }
  .btn.cancel { background: #e9ebef; color: #333; }
  .sheet .hint { font-size: 11px; color: var(--label); text-align: center; margin-top: 14px; line-height: 1.6; }

/* スマホ縦画面：左の参考画像くらいの大きさ・余白感 */
@media (max-width: 600px) {
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
  }

  body { min-height: 100dvh; }

  .app {
    width: 100%;
    max-width: none;
    height: 100dvh;
    min-height: 0;
    overflow: hidden;
  }

  .header {
    padding-top: calc(env(safe-area-inset-top, 0px) + 8px);
    padding-bottom: 14px;
    padding-left: max(14px, env(safe-area-inset-left, 0px));
    padding-right: max(14px, env(safe-area-inset-right, 0px));
  }

  .header .ico { width: 34px; height: 27px; }
  .header .titles h1 { font-size: 18px; }
  .header .titles time { font-size: 10px; }

  .content {
    min-height: 0;
    overflow: hidden;
    margin: 4px 10px 8px;
    border-radius: 18px;
    padding: 20px 16px calc(14px + env(safe-area-inset-bottom, 0px));
  }

  /* 参考画像の左側くらいの写真サイズ */
  .photo {
    width: 196px;
    height: 261px;
    max-width: 60%;
    aspect-ratio: 3 / 4;
    margin: 4px auto 18px;
  }

  .name-block {
    margin-bottom: 20px;
  }

  .name-block .lab { font-size: 13px; }
  .name-block .val {
    font-size: 20px;
    margin-top: 5px;
  }

  .grid {
    gap: 16px 12px;
    margin-bottom: 19px;
  }

  .grid .lab { font-size: 12px; }
  .grid .val {
    font-size: 14px;
    margin-top: 5px;
    line-height: 1.2;
  }

  .footer {
    gap: 10px;
    padding-top: 0;
  }

  .footer .text {
    font-size: 10px;
    line-height: 1.5;
  }

  .footer .text .cert { margin-bottom: 6px; }
  .footer .text .issuer {
    margin-top: 5px;
    font-size: 13px;
  }

  .seal {
    width: 64px;
    height: 64px;
    border-width: 2px;
  }

  .seal span {
    font-size: 20px;
  }

  .edit-fab {
    height: 44px;
    padding: 0 17px;
    right: calc(12px + env(safe-area-inset-right, 0px));
    bottom: calc(12px + env(safe-area-inset-bottom, 0px));
    border-radius: 22px;
    font-size: 13px;
  }
}

/* 少し縦の短いスマホだけ、写真を少しだけ縮めて全体を収める */
@media (max-width: 600px) and (max-height: 740px) {
  .content {
    padding-top: 14px;
    padding-bottom: 10px;
  }

  .photo {
    width: 180px;
    height: 240px;
    margin-bottom: 14px;
  }

  .name-block { margin-bottom: 15px; }
  .grid { gap: 12px 10px; margin-bottom: 15px; }
  .grid .val { font-size: 13px; }
  .footer .text { font-size: 9px; }
}

</style>
</head>
<body>
  <div class="app">
    <div class="header">
      <div class="header-row">
        <svg class="ico" id="editBtn" role="button" aria-label="内容を編集" tabindex="0" style="cursor:pointer" viewBox="0 0 48 36" fill="none" stroke="currentColor" stroke-width="2.4">
          <rect x="2" y="3" width="44" height="30" rx="4"/>
          <rect x="7" y="9" width="14" height="11" rx="1.5"/>
          <line x1="27" y1="11" x2="41" y2="11"/><line x1="27" y1="18" x2="41" y2="18"/><line x1="7" y1="26" x2="41" y2="26"/>
        </svg>
        <div class="titles"><h1 id="docTitle">学生証</h1><time id="clock"></time></div>
        <button class="close" aria-label="閉じる">✕</button>
      </div>
    </div>

    <div class="content">
      <div class="photo" id="photoBox">
        <svg viewBox="0 0 100 100" aria-hidden="true">
          <circle cx="50" cy="38" r="20" fill="#7a8394"/>
          <path d="M18 92c0-20 14-30 32-30s32 10 32 30z" fill="#7a8394"/>
        </svg>
      </div>

      <div class="name-block"><div class="lab">氏名</div><div class="val" id="f-name"></div></div>

      <div class="grid">
        <div><div class="lab">学科</div><div class="val" id="f-dept"></div></div>
        <div><div class="lab">コース</div><div class="val" id="f-course"></div></div>
        <div><div class="lab">学籍番号</div><div class="val" id="f-id"></div></div>
        <div><div class="lab">生年月日</div><div class="val" id="f-dob"></div></div>
        <div><div class="lab">発行日</div><div class="val" id="f-issued"></div></div>
        <div><div class="lab">有効期限</div><div class="val" id="f-expiry"></div></div>
      </div>

      <div class="footer">
        <div class="text">
          <p class="cert" id="f-cert"></p>
          <p class="addr" id="f-addr"></p>
          <p class="issuer" id="f-issuer"></p>
        </div>
        <div class="seal" aria-label="ダミー印（見本）"><span>見本</span></div>
      </div>
    </div>
  </div>

  <div class="sheet-bg" id="sheetBg"></div>
  <div class="sheet" id="sheet" role="dialog" aria-label="内容を編集">
    <h2>内容を編集</h2>
    <div class="photo-row">
      <img class="photo-prev" id="photoPrev" alt="写真プレビュー">
      <div>
        <label for="photoInput" style="font-size:13px;color:var(--accent);font-weight:700;">写真を選ぶ</label>
        <input id="photoInput" type="file" accept="image/*" style="font-size:13px;margin-top:4px;">
      </div>
    </div>
    <div class="field"><label>タイトル</label><input id="in-title"></div>
    <div class="field"><label>氏名</label><input id="in-name"></div>
    <div class="field"><label>学科</label><input id="in-dept"></div>
    <div class="field"><label>コース</label><input id="in-course"></div>
    <div class="field"><label>学籍番号</label><input id="in-id"></div>
    <div class="field"><label>生年月日</label><input id="in-dob"></div>
    <div class="field"><label>発行日</label><input id="in-issued"></div>
    <div class="field"><label>有効期限</label><input id="in-expiry"></div>
    <div class="field"><label>証明文</label><input id="in-cert"></div>
    <div class="field"><label>住所</label><input id="in-addr"></div>
    <div class="field"><label>発行者</label><input id="in-issuer"></div>
    <div class="btn-row">
      <button class="btn cancel" id="cancelBtn">キャンセル</button>
      <button class="btn save" id="saveBtn">保存</button>
    </div>
    <p class="hint">保存した内容はこのスマホのブラウザ内だけに残ります。<br>他の人・他の端末には共有されません。</p>
  </div>

<script>
  const KEY = "idcard_data_v1";
  const defaults = {
    title: "学生証", name: "山田 太郎", dept: "総合工学科", course: "サンプルコース",
    id: "0000000", dob: "2000年01月01日", issued: "2023年04月01日", expiry: "2028年03月31日",
    cert: "上記のものは本サンプル団体の会員であることを証明する。",
    addr: "○○県○○市サンプル1丁目2番3号", issuer: "サンプル学園 代表", photo: ""
  };

  function load() {
    try { const s = localStorage.getItem(KEY); if (s) return { ...defaults, ...JSON.parse(s) }; } catch (e) {}
    return { ...defaults };
  }
  function save(d) { try { localStorage.setItem(KEY, JSON.stringify(d)); } catch (e) {} }

  let data = load();
  const $ = id => document.getElementById(id);
  const setTxt = (id, v) => { const el = $(id); if (el) el.textContent = v; };

  function renderPhoto() {
    const box = $("photoBox");
    if (data.photo) box.innerHTML = '<img alt="写真" src="' + data.photo + '">';
    else box.innerHTML = '<svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="38" r="20" fill="#7a8394"/><path d="M18 92c0-20 14-30 32-30s32 10 32 30z" fill="#7a8394"/></svg>';
  }
  function render() {
    $("docTitle").textContent = data.title;
    setTxt("f-name", data.name); setTxt("f-dept", data.dept); setTxt("f-course", data.course);
    setTxt("f-id", data.id); setTxt("f-dob", data.dob); setTxt("f-issued", data.issued);
    setTxt("f-expiry", data.expiry); setTxt("f-cert", data.cert); setTxt("f-addr", data.addr);
    setTxt("f-issuer", data.issuer); renderPhoto();
  }
  render();

  const sheet = $("sheet"), sheetBg = $("sheetBg");
  let pendingPhoto = data.photo;

  function openSheet() {
    $("in-title").value = data.title; $("in-name").value = data.name; $("in-dept").value = data.dept;
    $("in-course").value = data.course; $("in-id").value = data.id; $("in-dob").value = data.dob;
    $("in-issued").value = data.issued; $("in-expiry").value = data.expiry; $("in-cert").value = data.cert;
    $("in-addr").value = data.addr; $("in-issuer").value = data.issuer;
    pendingPhoto = data.photo; updatePrev();
    sheetBg.classList.add("open"); sheet.classList.add("open");
  }
  function closeSheet() { sheetBg.classList.remove("open"); sheet.classList.remove("open"); }
  function updatePrev() { const p = $("photoPrev"); if (pendingPhoto) p.src = pendingPhoto; else p.removeAttribute("src"); }

  $("editBtn").onclick = openSheet;
  $("cancelBtn").onclick = closeSheet;
  sheetBg.onclick = closeSheet;

  $("saveBtn").onclick = () => {
    data = {
      title: $("in-title").value, name: $("in-name").value, dept: $("in-dept").value, course: $("in-course").value,
      id: $("in-id").value, dob: $("in-dob").value, issued: $("in-issued").value, expiry: $("in-expiry").value,
      cert: $("in-cert").value, addr: $("in-addr").value, issuer: $("in-issuer").value, photo: pendingPhoto
    };
    save(data); render(); closeSheet();
  };

  $("photoInput").onchange = e => {
    const file = e.target.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      const img = new Image();
      img.onload = () => {
        const max = 600, scale = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement("canvas");
        c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        pendingPhoto = c.toDataURL("image/jpeg", 0.8); updatePrev();
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  };

  const clock = $("clock"), z = n => String(n).padStart(2, "0");
  function tick() {
    const d = new Date();
    clock.textContent = `${d.getFullYear()}年${z(d.getMonth()+1)}月${z(d.getDate())}日　${z(d.getHours())}時${z(d.getMinutes())}分${z(d.getSeconds())}秒`;
  }
  tick(); setInterval(tick, 1000);
</script>
</body>
</html>
