<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<!-- ↓↓ ホーム画面に追加したとき、Safariのバーを消して全画面アプリとして開くための設定 ↓↓ -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="IDカード">
<meta name="theme-color" content="#0f1b33">
<!-- ↑↑ ここまで ↑↑ -->

<title>IDカード</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }

  :root {
    --app-bg: #0f1b33;
    --app-bg-2: #14234a;
    --chrome-fg: #ffffff;
    --chrome-sub: #8a98b5;
    --card-bg: #ffffff;
    --card-fg: #111418;
    --label: #6b7280;
    --seal: #c0392b;
    --line: #e6e8ec;
  }

  body {
    font-family: "Noto Sans JP", system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    background: var(--app-bg);
    color: var(--card-fg);
    /* 画面全体を埋める。ノッチやホームバーを避けて中身を配置 */
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    justify-content: center;
    background-image: radial-gradient(120% 55% at 50% 0%, var(--app-bg-2) 0%, var(--app-bg) 55%);
    background-attachment: fixed;
    -webkit-tap-highlight-color: transparent;
  }

  .screen {
    width: 100%;
    max-width: 440px;
    /* iPhoneの安全領域（ステータスバー・ホームバー・左右）を避ける */
    padding-top: calc(env(safe-area-inset-top, 0px) + 6px);
    padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 28px);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }

  .topbar {
    display: flex;
    align-items: center;
    gap: 12px;
    color: var(--chrome-fg);
    padding: 14px 4px 4px;
  }
  .topbar .ico { width: 40px; height: 32px; flex: none; opacity: .85; }
  .topbar .titles { flex: 1; text-align: center; }
  .topbar .titles h1 {
    margin: 0; font-size: 19px; font-weight: 700; letter-spacing: .14em;
  }
  .topbar .titles time {
    display: block; margin-top: 4px; font-size: 12px;
    color: var(--chrome-sub); font-variant-numeric: tabular-nums;
  }
  .close {
    width: 32px; height: 32px; flex: none; border-radius: 50%;
    background: rgba(255,255,255,.12); border: none; color: var(--chrome-fg);
    font-size: 17px; line-height: 1; cursor: pointer; display: grid; place-items: center;
  }

  .card {
    margin-top: 16px;
    background: var(--card-bg);
    color: var(--card-fg);
    border-radius: 16px;
    padding: 26px 22px 24px;
    box-shadow: 0 18px 40px rgba(0,0,0,.35);
  }

  .photo {
    width: 190px; max-width: 62%; aspect-ratio: 3 / 4;
    margin: 6px auto 22px; border-radius: 6px;
    background: linear-gradient(180deg, #d9dde4, #c3c9d3);
    display: grid; place-items: center; overflow: hidden;
  }
  .photo svg { width: 70%; height: 70%; opacity: .55; }

  .name-block { text-align: center; margin-bottom: 26px; }
  .name-block .lab { font-size: 12px; color: var(--label); letter-spacing: .1em; }
  .name-block .val { font-size: 30px; font-weight: 700; letter-spacing: .14em; margin-top: 6px; }

  .grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 22px 16px;
    text-align: center; margin-bottom: 26px;
  }
  .grid .lab { font-size: 12px; color: var(--label); letter-spacing: .08em; }
  .grid .val {
    font-size: 20px; font-weight: 700; margin-top: 6px;
    font-variant-numeric: tabular-nums; overflow-wrap: anywhere;
  }

  .footer {
    border-top: 1px solid var(--line); padding-top: 18px;
    display: flex; align-items: flex-end; gap: 14px;
  }
  .footer .text { flex: 1; min-width: 0; font-size: 14px; line-height: 1.7; }
  .footer .text .cert { margin: 0 0 10px; }
  .footer .text .addr { margin: 0; color: #333; }
  .footer .text .issuer { margin: 4px 0 0; font-size: 19px; font-weight: 700; }

  .seal {
    flex: none; width: 86px; height: 86px;
    border: 3px solid var(--seal); border-radius: 8px; color: var(--seal);
    display: grid; place-items: center; transform: rotate(-4deg); font-weight: 700;
  }
  .seal span { writing-mode: vertical-rl; font-size: 26px; letter-spacing: .18em; }

  .note {
    margin: 18px 4px 0; color: var(--chrome-sub);
    font-size: 11px; text-align: center; line-height: 1.6;
  }
</style>
</head>
<body>
  <div class="screen">
    <div class="topbar">
      <svg class="ico" viewBox="0 0 48 36" fill="none" stroke="currentColor" stroke-width="2.4">
        <rect x="2" y="3" width="44" height="30" rx="4"/>
        <rect x="7" y="9" width="14" height="10" rx="1.5"/>
        <line x1="27" y1="11" x2="41" y2="11"/>
        <line x1="27" y1="18" x2="41" y2="18"/>
        <line x1="7" y1="25" x2="41" y2="25"/>
      </svg>
      <div class="titles">
        <h1 id="docTitle">学生証</h1>
        <time id="clock"></time>
      </div>
      <button class="close" aria-label="閉じる">✕</button>
    </div>

    <div class="card">
      <div class="photo">
        <svg viewBox="0 0 100 100" aria-hidden="true">
          <circle cx="50" cy="38" r="20" fill="#7a8394"/>
          <path d="M18 92c0-20 14-30 32-30s32 10 32 30z" fill="#7a8394"/>
        </svg>
      </div>

      <div class="name-block">
        <div class="lab">氏名</div>
        <div class="val" id="f-name">山田　太郎</div>
      </div>

      <div class="grid">
        <div><div class="lab">学科</div><div class="val" id="f-dept">総合工学科</div></div>
        <div><div class="lab">コース</div><div class="val" id="f-course">サンプルコース</div></div>
        <div><div class="lab">学籍番号</div><div class="val" id="f-id">0000000</div></div>
        <div><div class="lab">生年月日</div><div class="val" id="f-dob">2000年01月01日</div></div>
        <div><div class="lab">発行日</div><div class="val" id="f-issued">2023年04月01日</div></div>
        <div><div class="lab">有効期限</div><div class="val" id="f-expiry">2028年03月31日</div></div>
      </div>

      <div class="footer">
        <div class="text">
          <p class="cert" id="f-cert">上記のものは本サンプル団体の会員であることを証明する。</p>
          <p class="addr" id="f-addr">○○県○○市サンプル1丁目2番3号</p>
          <p class="issuer" id="f-issuer">サンプル学園　代表</p>
        </div>
        <div class="seal" aria-label="ダミー印（見本）">
          <span>見本</span>
        </div>
      </div>
    </div>

    <p class="note">これはデザイン見本のテンプレートです。公的な証明書ではありません。</p>
  </div>

<script>
  // ▼▼ ここを自分たちの内容に書き換えてください ▼▼
  const data = {
    title:   "学生証",
    name:    "山田　太郎",
    dept:    "総合工学科",
    course:  "サンプルコース",
    id:      "0000000",
    dob:     "2000年01月01日",
    issued:  "2023年04月01日",
    expiry:  "2028年03月31日",
    cert:    "上記のものは本サンプル団体の会員であることを証明する。",
    addr:    "○○県○○市サンプル1丁目2番3号",
    issuer:  "サンプル学園　代表",
  };
  // ▲▲ ここまで ▲▲

  const set = (id, v) => { const el = document.getElementById(id); if (el) el.textContent = v; };
  document.getElementById("docTitle").textContent = data.title;
  set("f-name", data.name); set("f-dept", data.dept); set("f-course", data.course);
  set("f-id", data.id); set("f-dob", data.dob); set("f-issued", data.issued);
  set("f-expiry", data.expiry); set("f-cert", data.cert); set("f-addr", data.addr);
  set("f-issuer", data.issuer);

  const clock = document.getElementById("clock");
  const z = n => String(n).padStart(2, "0");
  function tick() {
    const d = new Date();
    clock.textContent =
      `${d.getFullYear()}年${z(d.getMonth()+1)}月${z(d.getDate())}日　` +
      `${z(d.getHours())}時${z(d.getMinutes())}分${z(d.getSeconds())}秒`;
  }
  tick(); setInterval(tick, 1000);
</script>
</body>
</html>
